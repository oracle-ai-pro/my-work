<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>My Mindmap | Prestige HQ</title>
    <link rel="icon" type="image/png" href="mindmap.png">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app-shell">
        <header class="app-topbar">
            <a class="topbar-back" href="../index.html" title="My Work">
                <span class="material-symbols-rounded">arrow_back</span>
            </a>
            <div class="topbar-title-wrap">
                <input type="text" class="topbar-title" id="map-title" readonly
                    title="Нажмите, чтобы переименовать"
                    value="Ментальная карта">
            </div>
            <span class="beta-pill">BETA</span>
            <div class="topbar-actions">
                <button type="button" class="icon-btn" id="btn-maps" title="Все карты">
                    <span class="material-symbols-rounded">folder_open</span>
                </button>
                <button type="button" class="icon-btn" id="btn-export" title="Экспорт JSON">
                    <span class="material-symbols-rounded">download</span>
                </button>
                <button type="button" class="icon-btn" id="btn-import" title="Импорт JSON">
                    <span class="material-symbols-rounded">upload</span>
                </button>
                <input type="file" id="import-file" class="hidden" accept=".json">
                <button type="button" class="icon-btn" id="btn-theme" title="Тема">
                    <span class="material-symbols-rounded">dark_mode</span>
                </button>
            </div>
        </header>

        <div class="toolbar">
            <button type="button" class="tool-btn" id="btn-add-child" title="Tab">
                <span class="material-symbols-rounded">subdirectory_arrow_right</span>
                <span class="label">Дочерний</span>
            </button>
            <button type="button" class="tool-btn" id="btn-add-sibling" title="Enter">
                <span class="material-symbols-rounded">arrow_forward</span>
                <span class="label">Сосед</span>
            </button>
            <button type="button" class="tool-btn" id="btn-delete" title="Delete">
                <span class="material-symbols-rounded">delete</span>
                <span class="label">Удалить</span>
            </button>
            <div class="sep"></div>
            <button type="button" class="tool-btn" id="btn-color" title="Цвет">
                <span class="material-symbols-rounded">palette</span>
                <span class="label">Цвет</span>
            </button>
            <button type="button" class="tool-btn" id="btn-collapse" title="Свернуть ветку">
                <span class="material-symbols-rounded">unfold_less</span>
                <span class="label">Свернуть</span>
            </button>
            <div class="sep"></div>
            <button type="button" class="tool-btn" id="btn-fit" title="Вписать">
                <span class="material-symbols-rounded">fit_screen</span>
                <span class="label">Вписать</span>
            </button>
            <button type="button" class="tool-btn" id="btn-center" title="К центру">
                <span class="material-symbols-rounded">my_location</span>
                <span class="label">Центр</span>
            </button>
            <div class="sep"></div>
            <button type="button" class="tool-btn" id="btn-new-map" title="Новая карта">
                <span class="material-symbols-rounded">add</span>
                <span class="label">Новая</span>
            </button>
        </div>

        <div id="stage-wrap">
            <svg id="mind-svg" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <filter id="node-shadow" x="-20%" y="-20%" width="140%" height="140%">
                        <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.25"/>
                    </filter>
                </defs>
                <g id="viewport">
                    <g id="links-layer"></g>
                    <g id="nodes-layer"></g>
                </g>
            </svg>
            <textarea id="node-editor" class="hidden" rows="1"></textarea>
            <div id="color-palette" class="palette hidden"></div>
            <div class="status-bar">
                <div class="zoom-chip">
                    <button type="button" id="zoom-out" title="-">−</button>
                    <span id="zoom-label">100%</span>
                    <button type="button" id="zoom-in" title="+">+</button>
                </div>
                <div class="hint-chip">Перетаскивание · Колёсико/щипок — зум · Tab / Enter / Del</div>
            </div>
        </div>
    </div>

    <!-- Выбор карты -->
    <div id="picker-screen" class="picker-screen hidden">
        <div class="picker-header">
            <a class="topbar-back" href="../index.html"><span class="material-symbols-rounded">arrow_back</span></a>
            <h1>Ментальные карты <span class="beta-pill">BETA</span></h1>
            <button type="button" class="icon-btn" id="picker-new" title="Создать">
                <span class="material-symbols-rounded">add</span>
            </button>
        </div>
        <div id="picker-list" class="picker-list"></div>
    </div>

    <!-- Confirm -->
    <div id="confirm-modal" class="modal-overlay hidden">
        <div class="modal-card">
            <div class="modal-head">
                <h3 id="confirm-title">Подтвердите</h3>
                <button type="button" class="icon-btn" id="confirm-close"><span class="material-symbols-rounded">close</span></button>
            </div>
            <div class="modal-body">
                <p id="confirm-text" style="color:var(--muted);font-size:0.95rem;line-height:1.45;"></p>
            </div>
            <div class="modal-foot">
                <button type="button" class="btn btn-ghost" id="confirm-cancel">Отмена</button>
                <button type="button" class="btn btn-danger" id="confirm-ok">Удалить</button>
            </div>
        </div>
    </div>

    <div id="prompt-modal" class="modal-overlay hidden">
        <div class="modal-card">
            <div class="modal-head">
                <h3 id="prompt-title">Название</h3>
            </div>
            <div class="modal-body">
                <div class="field">
                    <label>Значение</label>
                    <input type="text" id="prompt-input" autocomplete="off">
                </div>
            </div>
            <div class="modal-foot">
                <button type="button" class="btn btn-ghost" id="prompt-cancel">Отмена</button>
                <button type="button" class="btn btn-primary" id="prompt-ok">Сохранить</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
