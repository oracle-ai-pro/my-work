<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Таблицы на обслуживании | Prestige HQ</title>
    <link rel="icon" type="image/png" href="spreadsheets.png">
    <meta http-equiv="refresh" content="8;url=../index.html">
    <style>
        :root {
            --bg: #050505;
            --card: #121212;
            --text: #f8fafc;
            --muted: #94a3b8;
            --accent: #f59e0b;
            --border: rgba(255,255,255,0.1);
        }
        @media (prefers-color-scheme: light) {
            :root {
                --bg: #f8fafc;
                --card: #ffffff;
                --text: #0f172a;
                --muted: #64748b;
                --border: rgba(0,0,0,0.08);
            }
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            padding: 24px;
        }
        .card {
            max-width: 440px;
            width: 100%;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 28px 24px;
            text-align: center;
            box-shadow: 0 12px 40px rgba(0,0,0,0.2);
        }
        .icon {
            font-size: 48px;
            margin-bottom: 12px;
        }
        h1 {
            font-size: 1.25rem;
            margin-bottom: 10px;
            font-weight: 700;
        }
        p {
            color: var(--muted);
            font-size: 0.95rem;
            line-height: 1.55;
            margin-bottom: 12px;
        }
        .hint {
            font-size: 0.8rem;
            color: var(--muted);
            margin-top: 16px;
        }
        a.btn {
            display: inline-block;
            margin-top: 8px;
            padding: 10px 18px;
            background: var(--accent);
            color: #111;
            font-weight: 600;
            text-decoration: none;
            border-radius: 10px;
            font-size: 0.9rem;
        }
        a.btn:hover { filter: brightness(1.05); }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">🔧</div>
        <h1>Таблицы временно на обслуживании</h1>
        <p>
            Мы как можно быстрее пытаемся вернуть таблицы в строй.
            <strong>Ваши данные не потеряются.</strong>
        </p>
        <p>Извиняемся за неудобства.</p>
        <a class="btn" href="../index.html">На главную</a>
        <p class="hint">Переход через несколько секунд…</p>
    </div>
    <script>
        (function () {
            // Та же дата разблокировки, что на хабе (24.09.2026 18:00 CEST ≈ 16:00 UTC)
            var UNLOCK_AT = Date.UTC(2026, 8, 24, 16, 0, 0);
            if (Date.now() >= UNLOCK_AT) {
                // Когда срок вышел — можно вернуть нормальное приложение.
                // Сейчас просто не блокируем, если вы уже восстановили полный index.
                // Для полной версии замените этот файл обратно.
            }

            var msg =
                'Таблицы пока временно на обслуживании.\n\n' +
                'Мы как можно быстрее пытаемся вернуть таблицы в строй, ваши данные не потеряются.\n\n' +
                'Извиняемся за неудобства.';

            try {
                alert(msg);
            } catch (e) {}

            // Редирект на хаб
            window.location.replace('../index.html');
        })();
    </script>
</body>
</html>
